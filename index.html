<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>樂垃｜動物探索</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      color: #403b32;
    }

    #controls {
      position: fixed;
      top: 20px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      text-align: center;
    }

    button {
      padding: 14px 26px;
      border: none;
      border-radius: 30px;
      background: #e4c85e;
      color: #403b32;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      line-height: 1.5;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 2000;
      box-sizing: border-box;
      padding: 28px 24px;
      overflow-y: auto;
      background: #fff9e9;
      text-align: center;
    }

    #intro img {
      display: block;
      width: auto;
      max-width: 85%;
      height: 40vh;
      object-fit: contain;
      margin: 12px auto 20px;
    }

    #intro h2 {
      margin: 12px 0;
    }

    #intro p {
      max-width: 440px;
      margin: 0 auto 24px;
      line-height: 1.8;
      text-align: left;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="controls">
    <button id="start" disabled>載入中…</button>
    <p id="status">正在準備動物探索功能。</p>
  </div>

  <section id="intro" hidden>
    <h2>你找到黃喉貂了！</h2>
    <img src="./animal.png.png" alt="黃喉貂廚師">
    <p>
      我是樂垃裡的黃喉貂廚師！
      這裡之後會放入我的動物介紹與垃圾危害知識。
      現在可以移開卡牌，繼續觀看。
    </p>
    <button id="next">掃描下一張</button>
  </section>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    renderer="alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="card"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const startButton = document.querySelector("#start");
    const nextButton = document.querySelector("#next");
    const statusText = document.querySelector("#status");
    const intro = document.querySelector("#intro");
    const card = document.querySelector("#card");

    let mode = "idle";
    let stopTimer;

    function prepareButton() {
      startButton.disabled = false;
      startButton.textContent = "開始掃描";
      statusText.textContent =
        "按下開始後，請允許使用相機。";
    }

    if (scene.hasLoaded) {
      prepareButton();
    } else {
      scene.addEventListener("loaded", prepareButton, {
        once: true
      });
    }

    function showError() {
      mode = "error";
      intro.hidden = true;
      startButton.hidden = false;
      startButton.disabled = true;
      startButton.textContent = "請重新整理後再試";
      statusText.textContent =
        "啟動失敗，請確認相機權限、網路與檔案。";
    }

    async function startScanning() {
      clearTimeout(stopTimer);
      mode = "starting";
      intro.hidden = true;
      startButton.hidden = false;
      startButton.disabled = true;
      statusText.textContent =
        "正在啟動相機，請稍候。";

      try {
        await scene.systems["mindar-image-system"].start();
      } catch (error) {
        console.error(error);
        showError();
      }
    }

    startButton.addEventListener("click", startScanning);
    nextButton.addEventListener("click", startScanning);

    scene.addEventListener("arReady", () => {
      if (mode !== "starting") return;
      mode = "scanning";
      startButton.hidden = true;
      statusText.textContent =
        "請將鏡頭對準完整的黃喉貂卡牌。";
    });

    scene.addEventListener("arError", showError);

    card.addEventListener("targetFound", () => {
      if (mode !== "scanning") return;

      mode = "reading";
      intro.hidden = false;

      stopTimer = setTimeout(() => {
        if (mode === "reading") {
          scene.systems["mindar-image-system"].stop();
        }
      }, 0);
    });
  </script>
</body>
</html>
